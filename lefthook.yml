pre-commit:
  piped: true # Lint fixes can change the formatting, so format last, then test the result.
  commands:
    1-ruff-check:
      glob: "*.py"
      run: uvx ruff@0.17.4 check --fix {staged_files}
      stage_fixed: true
    2-ruff-format:
      glob: "*.py"
      run: uvx ruff@0.17.4 format {staged_files}
      stage_fixed: true
    3-tests:
      run: uvx --python 3.10 --with wox-plugin==0.0.92 pytest --quiet
