target-version = "py310" # The oldest Python that Wox supports.
line-length = 120

[lint]
select = ["ALL"]
ignore = [
    "E501",   # The plugin embeds its logos as long SVG strings.
    "COM812", # Conflicts with the Ruff formatter.
    "D203",   # Conflicts with D211.
    "D213",   # Conflicts with D212.
    "CPY001", # The license is in the LICENSE file.
]

[lint.per-file-ignores]
"Wox.Plugin.JetBrainsProjects.py" = [
    "ERA001", # Wox requires the plugin's JSON metadata in a comment, which looks like commented-out code.
    "RUF003", # The Chinese translations in that metadata use fullwidth punctuation.
]
"test_plugin.py" = [
    "ANN",     # Test signatures say nothing useful.
    "ARG002",  # The fake Wox API keeps the signatures of the real one.
    "D",       # Test names say what each test checks.
    "PLR2004", # Tests compare with literal values.
    "S101",    # pytest tests use assert.
    "S102",    # The test loads the plugin the way Wox's host does, with exec.
    "SLF001",  # Tests call some of the plugin's private callbacks.
]
